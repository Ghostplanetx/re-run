*{box-sizing:border-box}html,body{margin:0}
body{background:#060907;color:#f3f6f4;font:500 15.5px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.bar{padding:12px 16px;border-bottom:1px solid #1f2b23}.bar img{height:28px;display:block}
.hero{background:#000}.hero img{display:block;width:100%;height:auto;max-width:1672px;margin:0 auto}
.box{width:100%;max-width:460px;margin:28px auto 48px;padding:0 16px}

p{color:#9aa8a0;margin:0 0 16px}
form{display:flex;gap:10px}
input{flex:1;min-width:0;background:#0d150f;border:1px solid #1f2b23;border-radius:12px;padding:14px;color:#fff;font:500 16px Inter}
input:focus{outline:2px solid #2bff6a;outline-offset:1px}
button{border:0;border-radius:12px;padding:14px 20px;font:700 15px Inter;cursor:pointer;background:linear-gradient(180deg,#8cff6b,#00e05a);color:#03200c;white-space:nowrap}
button:disabled{opacity:.6}
.err{color:#fbbf24;font-size:14px;margin-top:10px;min-height:20px}
